<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإحصائيات — أرشيف أبو علي الشيباني</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#2b2620; --muted:#7a7060;
  --accent:#0f766e; --accent-soft:#e4f2f0; --border:#e3dccc;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#171512; --panel:#211e19; --ink:#ece7dd; --muted:#a39a89;
        --accent:#2dd4bf; --accent-soft:#123f3a; --border:#3a352c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.4rem;margin:0 0 4px}
a.back{color:var(--accent);text-decoration:none;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:24px 0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card .num{font-size:2rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card .lbl{color:var(--muted);font-size:.85rem}
h2{font-size:1.05rem;margin:26px 0 10px}
.chart-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px 14px 8px;margin-top:10px;position:relative}
#chart{width:100%;height:180px;display:block;overflow:visible}
.bar{fill:var(--accent);cursor:pointer}
.bar:hover{fill:color-mix(in srgb, var(--accent) 80%, #000)}
.axis-line{stroke:var(--border);stroke-width:1}
.tick-label{fill:var(--muted);font-size:9px;font-family:inherit}
#tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);
  font-size:.78rem;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;
  transform:translate(-50%,-115%);z-index:5}
.chart-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:50px 0}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;
  font-variant-numeric:tabular-nums}
th{background:var(--accent-soft);font-size:.85rem}
.muted{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← العودة إلى البحث</a>
  <h1>إحصائيات الاستخدام</h1>
  <div class="muted" id="since"></div>

  <div class="cards">
    <div class="card"><div class="num" id="total">…</div><div class="lbl">إجمالي عمليات البحث</div></div>
    <div class="card"><div class="num" id="ips">…</div><div class="lbl">عناوين IP فريدة</div></div>
    <div class="card"><div class="num" id="search">…</div><div class="lbl">بحث دلالي 🔍</div></div>
    <div class="card"><div class="num" id="ask">…</div><div class="lbl">أسئلة ذكية 🤖</div></div>
    <div class="card"><div class="num" id="today">…</div><div class="lbl">عمليات اليوم</div></div>
    <div class="card"><div class="num" id="today-ips">…</div><div class="lbl">زوار اليوم (IP)</div></div>
  </div>

  <h2>آخر 30 يوماً</h2>
  <div class="chart-wrap">
    <svg id="chart" preserveAspectRatio="none"></svg>
    <div id="tooltip"></div>
  </div>

  <h2>حسب اليوم</h2>
  <table>
    <thead><tr><th>اليوم</th><th>عمليات البحث</th><th>عناوين IP فريدة</th></tr></thead>
    <tbody id="days"></tbody>
  </table>
</div>
<script>
let statsData = null;

function renderChart(){
  const svg = document.getElementById('chart');
  const days = statsData.per_day || [];
  if(!days.length){
    svg.style.height = '0';
    svg.parentElement.insertAdjacentHTML('beforeend', '<div class="chart-empty">لا يوجد نشاط في الفترة الأخيرة</div>');
    return;
  }
  const W = svg.parentElement.clientWidth - 28, H = 170;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const max = Math.max(1, ...days.map(d=>d.queries));
  const gap = 3, n = days.length, bw = Math.max(2, W / n - gap);
  const baseline = H - 16;
  let svgHtml = `<line class="axis-line" x1="0" y1="${baseline}" x2="${W}" y2="${baseline}"/>`;
  days.forEach((d, i)=>{
    const h = Math.max(1, (d.queries / max) * (baseline - 6));
    const x = i * (bw + gap);
    const y = baseline - h;
    svgHtml += `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}" rx="2"
      data-date="${d.date}" data-q="${d.queries}" data-ips="${d.unique_ips}"></rect>`;
    if(i===0 || i===days.length-1 || i===Math.floor(days.length/2)){
      svgHtml += `<text class="tick-label" x="${x}" y="${H-2}">${d.date.slice(5)}</text>`;
    }
  });
  svg.innerHTML = svgHtml;
  const tip = document.getElementById('tooltip');
  svg.querySelectorAll('.bar').forEach(bar=>{
    bar.addEventListener('mouseenter', ()=>{
      const r = svg.getBoundingClientRect();
      const br = bar.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = (br.left - r.left + br.width/2) + 'px';
      tip.style.top = (br.top - r.top) + 'px';
      tip.textContent = `${bar.dataset.date}: ${bar.dataset.q} · ${bar.dataset.ips} IP`;
    });
    bar.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
  });
}

fetch('/api/statistics').then(r=>r.json()).then(d=>{
  statsData = d;
  const set=(id,v)=>document.getElementById(id).textContent=(v??0).toLocaleString('ar-EG');
  set('total',d.total_queries); set('ips',d.unique_ips);
  set('search',d.search_queries); set('ask',d.ask_queries);
  set('today',d.today_queries); set('today-ips',d.today_unique_ips);
  document.getElementById('since').textContent = d.since ? `منذ ${d.since}` : 'لا توجد بيانات بعد';
  const tb=document.getElementById('days');
  const rows = (d.per_day||[]).slice().reverse();  // most recent first in the table
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.date}</td><td>${r.queries.toLocaleString('ar-EG')}</td><td>${r.unique_ips.toLocaleString('ar-EG')}</td>`;
    tb.appendChild(tr);
  });
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="3" class="muted">لا يوجد نشاط في الفترة الأخيرة</td></tr>';
  }
  renderChart();
});
window.addEventListener('resize', ()=>{
  if(statsData){ document.getElementById('chart').innerHTML=''; renderChart(); }
});
</script>
</body>
</html>
